name: demo-gate-failure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expected-findings:
    name: expected-findings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install scanners
        run: |
          bash scripts/install-scanners.sh gitleaks trivy hadolint security
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show gate failures on vulnerable fixtures
        run: make demo-fail
